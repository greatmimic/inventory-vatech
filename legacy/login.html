<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VATECH — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0f1117;
    --surface: #181c27;
    --border:  #2a2f3d;
    --accent:  #00d4ff;
    --danger:  #ff4444;
    --text:    #e8eaf0;
    --muted:   #6b7280;
    --mono:    'IBM Plex Mono', monospace;
    --sans:    'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 32px;
  }
  .logo span { color: var(--muted); font-weight: 400; }
  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input {
    display: block;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 20px;
  }
  input:focus { border-color: var(--accent); }
  button[type=submit] {
    width: 100%;
    background: var(--accent);
    color: #0f1117;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    padding: 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 4px;
  }
  button[type=submit]:hover { opacity: 0.85; }
  button[type=submit]:disabled { opacity: 0.45; cursor: not-allowed; }
  .error {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--danger);
    margin-top: 14px;
    text-align: center;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">VATECH <span>/ INVENTORY</span></div>
  <form id="form" onsubmit="handleLogin(event)">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@vatech.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    <button type="submit" id="btn">SIGN IN</button>
    <div class="error" id="err"></div>
  </form>
</div>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true;
  btn.textContent = 'SIGNING IN...';
  err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const data = await res.json();
      err.textContent = data.error || 'Login failed';
      btn.disabled = false;
      btn.textContent = 'SIGN IN';
    }
  } catch {
    err.textContent = 'Network error — please try again';
    btn.disabled = false;
    btn.textContent = 'SIGN IN';
  }
}
</script>
</body>
</html>
